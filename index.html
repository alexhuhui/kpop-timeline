<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Personal Kpop Timeline</title>
  <meta name="description" content="An interactive timeline of my K-pop biases since 2018. Tap a song to watch its video.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23111'/%3E%3Crect x='3' y='7' width='10' height='2.4' fill='%23E8A317'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#list">Skip to the song list</a>

  <header class="top">
    <div class="titles">
      <span class="gold" aria-hidden="true"></span>
      <h1 id="title">Personal Kpop Timeline</h1>
      <p id="subtitle" class="subtitle"></p>
    </div>
    <dl id="stats" class="stats" aria-label="Summary"></dl>
  </header>

  <main>
    <section class="chart-wrap" aria-labelledby="chart-label">
      <h2 id="chart-label" class="visually-hidden">Timeline chart</h2>
      <div class="toolbar">
        <p class="hint" id="hint">
          <span class="hint--touch">Pinch to zoom, drag to move. Tap a song to watch it.</span>
          <span class="hint--mouse">Ctrl + scroll or the buttons to zoom, drag to move. Click a song to watch it.</span>
        </p>
        <div class="zoom-buttons" role="group" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-reset">Reset</button>
        </div>
      </div>
      <div id="chart" class="chart">
        <p class="status" id="status" role="status">Loading the timeline&hellip;</p>
      </div>
    </section>

    <section id="list" class="list" aria-labelledby="list-label" tabindex="-1">
      <details>
        <summary><h2 id="list-label">All songs as a list</h2></summary>
        <div id="list-body"></div>
      </details>
    </section>
  </main>

  <footer class="foot">
    <div>
      <p id="source"></p>
      <p id="note"></p>
    </div>
    <div class="foot__right">
      <p id="author"></p>
      <p id="date-line"></p>
    </div>
  </footer>

  <div id="card" class="card" role="dialog" aria-modal="false" aria-labelledby="card-title" hidden>
    <button type="button" class="card__close" id="card-close" aria-label="Close">&times;</button>
    <p class="card__kicker" id="card-kicker"></p>
    <h3 class="card__title" id="card-title" tabindex="-1"></h3>
    <div id="card-body"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
